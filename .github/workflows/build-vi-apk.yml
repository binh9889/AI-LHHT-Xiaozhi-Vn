name: Build AI-LHHT Vietnamese APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Fix flutter_pcm_player Android namespace
        shell: bash
        run: |
          PCM_DIR="$HOME/.pub-cache/hosted/pub.dev/flutter_pcm_player-0.0.1/android"
          GRADLE="$PCM_DIR/build.gradle"
          MANIFEST="$PCM_DIR/src/main/AndroidManifest.xml"
          if [ -f "$GRADLE" ]; then
            if grep -q 'namespace' "$GRADLE"; then
              sed -i 's/namespace "com.example.flutter_pcm_player"/namespace "com.lhht.flutter_pcm_player"/' "$GRADLE"
            else
              sed -i '/android {/a\    namespace "com.lhht.flutter_pcm_player"' "$GRADLE"
            fi
          fi
          if [ -f "$MANIFEST" ]; then
            sed -i 's/package="com.example.flutter_pcm_player"/package="com.lhht.flutter_pcm_player"/' "$MANIFEST"
          fi

      - name: Build APK
        run: flutter build apk --debug --build-name=2.2.0 --build-number=220

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk AI-LHHT-v2.2.0-VI.apk

      - name: SHA256
        run: sha256sum AI-LHHT-v2.2.0-VI.apk | tee AI-LHHT-v2.2.0-VI.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-LHHT-v2.2.0-VI
          path: |
            AI-LHHT-v2.2.0-VI.apk
            AI-LHHT-v2.2.0-VI.apk.sha256
