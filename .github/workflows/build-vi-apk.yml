name: Build AI-LHHT v3.1 Voice Pro Live Interpreter APK

on:
  workflow_dispatch:
  push:
    branches: [ main, develop-v3 ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'test/**'
      - '.github/workflows/build-vi-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: UI and unit tests
        run: flutter test test/widget_test.dart test/minimax_test.dart

      - name: Fix flutter_pcm_player Android namespace
        shell: bash
        run: |
          PCM_DIR="$HOME/.pub-cache/hosted/pub.dev/flutter_pcm_player-0.0.1/android"
          GRADLE="$PCM_DIR/build.gradle"
          MANIFEST="$PCM_DIR/src/main/AndroidManifest.xml"
          if [ -f "$GRADLE" ]; then
            if grep -q 'namespace' "$GRADLE"; then
              sed -i 's/namespace "com.example.flutter_pcm_player"/namespace "com.lhht.flutter_pcm_player"/' "$GRADLE"
            else
              sed -i '/android {/a\    namespace "com.lhht.flutter_pcm_player"' "$GRADLE"
            fi
          fi
          if [ -f "$MANIFEST" ]; then
            sed -i 's/package="com.example.flutter_pcm_player"/package="com.lhht.flutter_pcm_player"/' "$MANIFEST"
          fi

      - name: Build APK
        run: flutter build apk --debug --build-name=3.1.0 --build-number=310

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk AI-LHHT-v3.1.0-Voice-Pro-Live-Interpreter-VI.apk

      - name: SHA256
        run: sha256sum AI-LHHT-v3.1.0-Voice-Pro-Live-Interpreter-VI.apk | tee AI-LHHT-v3.1.0-Voice-Pro-Live-Interpreter-VI.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-LHHT-v3.1.0-Voice-Pro-Live-Interpreter-VI
          retention-days: 30
          path: |
            AI-LHHT-v3.1.0-Voice-Pro-Live-Interpreter-VI.apk
            AI-LHHT-v3.1.0-Voice-Pro-Live-Interpreter-VI.apk.sha256
